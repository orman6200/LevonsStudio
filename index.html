   <script>
      // Disable right-click context menu on page load.
      document.addEventListener('contextmenu', function(e) {
         e.preventDefault();
      });

      // Expand the Release Notes section on page load.
      document.addEventListener("DOMContentLoaded", () => {
         ExpandReleaseNotes();
      });

      const Icon_Small_Collapsed_3_PNG              = "Icon-Small-Collapsed-03.png";
      const Icon_Small_Expanded_3_PNG               = "Icon-Small-Expanded-03.png";
      document.getElementById("ArrowIconZ1a1a").src = Icon_Small_Collapsed_3_PNG;

      const PageFooterButtonZ1a1a = document.getElementById('PageFooterButtonZ1a1a');
      const ReleaseNotesContent   = document.getElementById('ReleaseNotesContent');
      PageFooterButtonZ1a1a.addEventListener('click', () => {
         const isOpen = ReleaseNotesContent.style.maxHeight && ReleaseNotesContent.style.maxHeight !== '0px';
         if (isOpen) {
            ReleaseNotesContent.style.maxHeight = '0';
            PageFooterButtonZ1a1a.appendChild(document.getElementById("ArrowIconZ1a1a").src = Icon_Small_Collapsed_3_PNG);
         } else {
            ReleaseNotesContent.style.maxHeight = ReleaseNotesContent.scrollHeight + 'px';
            PageFooterButtonZ1a1a.appendChild(document.getElementById("ArrowIconZ1a1a").src = Icon_Small_Expanded_3_PNG);
         }
      });

      function CollapseAllNotes() {
         const ReleaseNotesContent   = document.getElementById('ReleaseNotesContent');
         const ArrowIconZ1a6a        = document.getElementById('ArrowIconZ1a6a');
         const setCollapsedIcon = (arrowIcon) => {
            if (!arrowIcon) return;
            arrowIcon.src = Icon_Small_Collapsed_3_PNG;
         };
         if (ReleaseNotesContent) {
            ReleaseNotesContent.style.maxHeight = '0';
            setCollapsedIcon(ArrowIconZ1a6a);
         }
         ExpandReleaseNotes();
      }

      function ExpandReleaseNotes() {
         const ReleaseNotesContent   = document.getElementById('ReleaseNotesContent');
         const ArrowIconZ1a1a        = document.getElementById('ArrowIconZ1a1a');
         const setCollapsedIcon = (arrowIcon) => {
            if (!arrowIcon) return;
            arrowIcon.src = Icon_Small_Expanded_3_PNG;
         };
         if (ReleaseNotesContent) {
            ReleaseNotesContent.style.maxHeight = ReleaseNotesContent.scrollHeight + 'px';
            setCollapsedIcon(ArrowIconZ1a1a);
         }
      }
