                     <button id="PageFooterButtonZ1a3b"><span class="SpanFontWeight">Selection:   </span>I have hand-picked the song list (hundreds of hours of searching, listening, and viewing). Many of the tracks evoke decades of nostalgic memories. Contains 1,200+ music videos.</button>
                     <button id="PageFooterButtonZ1a3c"><span class="SpanFontWeight">Selection:   </span>Being a teenager in 1970's, my taste is hugely influenced by the music of that era. Classic Rock, Disco, Rhythem and Blues, Classic Pop, Jazz, etc. have clearly shapped my taste.</button>

                     <button id="PageFooterButtonZ1a3f"><span class="SpanFontWeight">Recommendation:   </span>Use a monitor with a resolution of 1920×1080 (HD) or higher (recommended). For the best sound, use a powerful computer speaker system or quality headphones.</button>
                     <button id="PageFooterButtonZ1a3g"><span class="SpanFontWeight">Copywrite:   </span>All music videos are sourced from © YouTube. The copywrite belongs to the original authors of the videos. No copywrite infringment is intended. There is no monetary interest or gain involved.</button>

                  </div>

                  <div id="PlayListNotesContent">
                     <button id="PageFooterButtonZ1a4b"><span class="SpanFontWeight">Linguistic Sculpting:   </span>My playlist names consist of three parts/words. Here is a grammatical explanation on how I came up with them.</button>
                     <button id="PageFooterButtonZ1a4c">1. The first words reprsent the genre of the music video list that the playlist contains.</button>
                     <button id="PageFooterButtonZ1a4d">   a. These indicate the style of the music - e.g., R&B, Disco, Rock.</button>  
                     <button id="PageFooterButtonZ1a4e">2. The second words are adjectives.</button>
                     <button id="PageFooterButtonZ1a4f">   a. They answer questions like “What kind?” or “What is it like?" - e.g., eclectic sound, divine energy, classic style.</button>
                     <button id="PageFooterButtonZ1a4g">3. The third words that always end with -ation, are deverbal nouns meaning they are nouns formed from verbs.</button>
                     <button id="PageFooterButtonZ1a4h">   a. They typically express one of these:</button>
                     <button id="PageFooterButtonZ1a4i">      - The act of doing something like create → creation (the act of creating),</button>
                     <button id="PageFooterButtonZ1a4j">      - The process of something happening like transform → transformation (the process of transforming),</button>
                     <button id="PageFooterButtonZ1a4k">      - The result or state produced by an action like inform → information (the state/result of informing),</button>
                     <button id="PageFooterButtonZ1a4l">      - A collective or abstract concept like civilize → civilization.</button>
                     <button id="PageFooterButtonZ1a4m">   b. The -ation ending turns actions into things - abstract, conceptual, or process-based things.</button>
                     <button id="PageFooterButtonZ1a4n">   c. Grammatically, these words behave like any other noun:</button>
                     <button id="PageFooterButtonZ1a4o">      - They can take articles: the celebration,</button>
                     <button id="PageFooterButtonZ1a4p">      - They can be subjects: transformation takes time,</button>
                     <button id="PageFooterButtonZ1a4q">      - They can be objects: we began the negotiation.</button>
                     <button id="PageFooterButtonZ1a4r">   d. The pattern behind is that the most -ation nouns come from verbs ending in:</button>
                     <button id="PageFooterButtonZ1a4s">      - -ate → activate → activation,</button>
                     <button id="PageFooterButtonZ1a4t">      - -ify (via -ification) → clarify → clarification,</button>
                     <button id="PageFooterButtonZ1a4u">      - -ize (via -ization) → modernize → modernization.</button>
                     <button id="PageFooterButtonZ1a4v">   e. You can coin many of them which is exactly the creative space I’ve been exploring.</button>
                     <button id="PageFooterButtonZ1a4w">Note: Explanation courtesy of Microsoft Copilot (OpenAI ChatGPT).</button>
                  </div>
               </div>

               <div class="Section-Z1a5">

                  <div id="OtherNotesContent">

         const  host =   window.location.hostname.toLowerCase();
         return host === "localhost" || host === "127.0.0.1" || host === "::1";
      }

               CommentSectionForm.addEventListener('submit', saveComment);

            function getCommentTimestamp() {
               const now = new Date();
               const yyyy = now.getFullYear();
               const mm = String(now.getMonth() + 1).padStart(2, '0');
               const dd = String(now.getDate()).padStart(2, '0');
               const hh = String(now.getHours()).padStart(2, '0');
               const mi = String(now.getMinutes()).padStart(2, '0');
               const ss = String(now.getSeconds()).padStart(2, '0');
               return `${yyyy}-${mm}-${dd}  ${hh}:${mi}:${ss}`;
            }

            function escapeHtml(value) {
               return String(value ?? '')
                  .replace(/&/g, '&amp;')
                  .replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;')
                  .replace(/'/g, '&#39;');
            }

            function parseCsvLine(line) {
               const fields = [];
               let current = '';
               let inQuotes = false;

               for (let i = 0; i < line.length; i++) {
                  const ch = line[i];
                  if (ch === '"') {
                     if (inQuotes && line[i + 1] === '"') {
                        current += '"';
                        i++;
                     } else {
                        inQuotes = !inQuotes;
                     }
                  } else if (ch === ',' && !inQuotes) {
                     fields.push(current);
                     current = '';
                  } else {
                     current += ch;
                  }
               }
               fields.push(current);
               return fields;
            }

            function saveComment(event) {
               event.preventDefault();

               const CommentSectionInputName = document.getElementById('CommentSectionInputName');
               const CommentSectionInputText = document.getElementById('CommentSectionInputText');
               const CommentSectionSubmitMessage = document.getElementById('CommentSectionSubmitMessage');

               if (!CommentSectionInputName || !CommentSectionInputText || !CommentSectionSubmitMessage) return;

               const CommentInputName = CommentSectionInputName.value.trim();
               const CommentInputText = CommentSectionInputText.value.trim();

               if (!CommentInputName || !CommentInputText) {
                  CommentSectionSubmitMessage.textContent = 'Message:  Enter both your Name and your Comments before clicking Submit.';
                  return;
               }

               const timestamp = getCommentTimestamp();
               CommentSectionSubmitMessage.textContent = 'Message:  Saving Name and Comments...';

               const body = new URLSearchParams();
               body.append('comment', `${CommentInputName}:  ${CommentInputText}`.replace(/\r?\n/g, ' '));
               body.append('name', CommentInputName);
               body.append('text', CommentInputText);
               body.append('timestamp', timestamp);

               fetch(Comment_Save_ASP, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                  cache: 'no-store',
                  body: body.toString()
               })
               .then(response => response.json())
               .then(result => {
                  if (result.success) {
                     CommentSectionInputName.value = '';
                     CommentSectionInputText.value = '';
                     return loadComments().then(() => {
                        CommentSectionSubmitMessage.textContent = 'Message:  Name and Comments saved.';
                     });
                  } else {
                     CommentSectionSubmitMessage.textContent = result.error || 'Message:  Name and Comments NOT saved.';
                  }
               })
               .catch((err) => {
                  console.error(err);
                  CommentSectionSubmitMessage.textContent = 'Message:  Name and Comments NOT saved. Ensure IIS with Classic ASP is enabled and Comment-Save.asp is accessible.';
               });
            }

               if (!CommentSectionPostedText) return Promise.resolve();

                  return response.text();

                  return `<div style="padding: 6px; border-bottom: 2px dashed; opacity:1.00;">` +

                         `<div><strong>Date/Time:  </strong>${escapeHtml(timestamp || '')}</div>` +
                         `</div>`;
               }

               const match = trimmed.match(/^"(.*)"$/);
               const text = match ? match[1].replace(/""/g, '"') : trimmed;

               return `<div>${escapeHtml(text)}</div>`;
            }

      function formatTime(seconds) {
         seconds        = Math.round(seconds);
         const h        = Math.floor(seconds / 3600);
         const m        = Math.floor((seconds % 3600) / 60);
         const s        = seconds % 60;
         const hDisplay = h.toString().padStart(2, '0'); 
         const mDisplay = m.toString().padStart(2, '0');
         const sDisplay = s.toString().padStart(2, '0');
         return h > 0 ? `${hDisplay}:${mDisplay}:${sDisplay}` : `${hDisplay}:${mDisplay}:${sDisplay}`;
      }

      function updateProgressBar() {
         if (_ytPlayer && _ytPlayer.getCurrentTime) {
            const currentTime                        = _ytPlayer.getCurrentTime();
            const duration                           = _ytPlayer.getDuration();
            if (duration && isFinite(duration) && duration > 0) {
               TimeSliderBar.value                   = (currentTime / duration) * 100;
               TimeSliderCurrentTimeSpan.textContent = formatTime(currentTime);
               TimeSliderTotalTimeSpan.textContent   = formatTime(duration);
            } else if (TimeSliderTotalTimeSpan) {
               TimeSliderTotalTimeSpan.textContent   = formatTime(0); 
            }
         }
      }

      function extractVideoId(u) {
         if (!u) return null;
         let m = u.match(/(?:v=|\/)([0-9A-Za-z_-]{11})(?:[&?#]|$)/);

         m = u.match(/youtu\.be\/([0-9A-Za-z_-]{11})(?:[&?#]|$)/);
         return m ? m[1] : null;
      }

            }

      // ****************************************************************************************************

      function CollapseAllNotes() {
         const BodyElement           = document.body;
         const BodyBackgroundColor   = getComputedStyle(BodyElement).backgroundColor;

         const LinerNotesContent     = document.getElementById('LinerNotesContent');
         const ArrowIconE1a3a        = document.getElementById('ArrowIconE1a3a');

         const DeveloperNotesContent = document.getElementById('DeveloperNotesContent');
         const ArrowIconZ1a2a        = document.getElementById('ArrowIconZ1a2a');

         const CuratorNotesContent   = document.getElementById('CuratorNotesContent');
         const ArrowIconZ1a3a        = document.getElementById('ArrowIconZ1a3a');

         const GeneralNotesContent   = document.getElementById('GeneralNotesContent');
         const ArrowIconZ1a4a        = document.getElementById('ArrowIconZ1a4a');

         const OtherNotesContent     = document.getElementById('OtherNotesContent');
         const ArrowIconZ1a5a        = document.getElementById('ArrowIconZ1a5a');

         const ReleaseNotesContent   = document.getElementById('ReleaseNotesContent');
         const ArrowIconZ1a6a        = document.getElementById('ArrowIconZ1a6a');

         // This function must be placed right here, before the if statements below it that call it.
         // Otherwise if this function is placed after all of the if statements, only the first if statement that calls it will be executed, and the rest of the if statements will not be executed. 
         const setCollapsedIcon = (arrowIcon) => {
            if (!arrowIcon) return;
            if (BodyBackgroundColor === 'rgb(255, 0, 122)') {              // Red  '#FF007A'
               arrowIcon.src = Icon_Small_Collapsed_1_PNG;
            } else if (BodyBackgroundColor === 'rgb(0, 151, 0)') {         // Green '#009700'
               arrowIcon.src = Icon_Small_Collapsed_2_PNG;
            } else if (BodyBackgroundColor === 'rgb(0, 122, 255)') {       // Blue '#007AFF'
               arrowIcon.src = Icon_Small_Collapsed_3_PNG;
            }
         };

         if (LinerNotesContent) {
            LinerNotesContent.style.maxHeight = '0';
            setCollapsedIcon(ArrowIconE1a3a);
         }

         if (DeveloperNotesContent) {
            DeveloperNotesContent.style.maxHeight = '0';
            setCollapsedIcon(ArrowIconZ1a2a);
         }

         if (CuratorNotesContent) {
            CuratorNotesContent.style.maxHeight = '0';
            setCollapsedIcon(ArrowIconZ1a3a);
         }

         if (GeneralNotesContent) {
            GeneralNotesContent.style.maxHeight = '0';
            setCollapsedIcon(ArrowIconZ1a4a);
         }

         if (OtherNotesContent) {
            OtherNotesContent.style.maxHeight = '0';
            setCollapsedIcon(ArrowIconZ1a5a);
         }

         if (ReleaseNotesContent) {
            ReleaseNotesContent.style.maxHeight = '0';
            setCollapsedIcon(ArrowIconZ1a6a);
         }

         ExpandReleaseNotes();
      }
      // ****************************************************************************************************
      // ****************************************************************************************************
      // ****************************************************************************************************
      function ExpandReleaseNotes() {
         const BodyElement           = document.body;
         const BodyBackgroundColor   = getComputedStyle(BodyElement).backgroundColor;
         const ReleaseNotesContent   = document.getElementById('ReleaseNotesContent');
         const ArrowIconZ1a6a        = document.getElementById('ArrowIconZ1a6a');

         // This function must be placed right here, before the if statements below it that call it.
         // Otherwise if this function is placed after all of the if statements, only the first if statement that calls it will be executed, and the rest of the if statements will not be executed. 
         const setCollapsedIcon = (arrowIcon) => {
            if (!arrowIcon) return;
            if (BodyBackgroundColor === 'rgb(255, 0, 122)') {              // Red  '#FF007A'
               arrowIcon.src = Icon_Small_Expanded_1_PNG;
            } else if (BodyBackgroundColor === 'rgb(0, 151, 0)') {         // Green '#009700'
               arrowIcon.src = Icon_Small_Expanded_2_PNG;
            } else if (BodyBackgroundColor === 'rgb(0, 122, 255)') {       // Blue '#007AFF'
               arrowIcon.src = Icon_Small_Expanded_3_PNG;
            }
         };

         if (ReleaseNotesContent) {
            ReleaseNotesContent.style.maxHeight = ReleaseNotesContent.scrollHeight + 'px';
            setCollapsedIcon(ArrowIconZ1a6a);
         }
      }
      // ****************************************************************************************************
      // ****************************************************************************************************
      // ****************************************************************************************************
      function WindowScrollToTopOfPage() {
         window.scrollTo({ 
            top:      0, 
            left:     0, 
            behavior: 'smooth'
         });

         ExpandReleaseNotes();
      }
      // ****************************************************************************************************
      // ****************************************************************************************************
      // ****************************************************************************************************
      function WindowScrollToTopOfPlayer() {
         const div = document.getElementById('Section-A');
         if (!div) return;
         const rect         = div.getBoundingClientRect();
         const scrollBottom = window.scrollY + rect.bottom;
         window.scrollTo({
            top:      scrollBottom,
            left:     0,
            behavior: 'smooth'
         });

         ExpandReleaseNotes();
      }
